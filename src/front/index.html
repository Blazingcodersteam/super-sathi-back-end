  <script>
    $(document).ready(function () {
      // Responsive mmenu - run immediately
      function handleMenuResize() {
        if ($(window).width() <= 1199) {
          $('.collapse.navbar-collapse').removeClass('collapse');
        } else {
          $('.navbar-collapse').addClass('collapse');
        }
      }

      handleMenuResize(); // Run once at start
      $(window).on('resize', handleMenuResize);

      // Delegated click events (so they work even after content reload)
      $(document).on('click', '.mobile-menu a', function () {
        $('.main-menu-wrap').addClass('open');
        $('.collapse.navbar-collapse').removeClass('collapse');
      });

      $(document).on('click', '.mobile_menu a', function () {
        $(this).parent().toggleClass('open');
        $('.main-menu-wrap').toggleClass('open');
      });

      $(document).on('click', '.menu-close', function () {
        $('.main-menu-wrap').removeClass('open');
      });

      $(document).on('click', '.mobile-top-bar', function () {
        $('.header-top').addClass('open');
      });

      $(document).on('click', '.close-header-top button', function () {
        $('.header-top').removeClass('open');
      });

      // Offcanvas menu
      var $offcanvasNav = $('.navbar-nav'),
        $offcanvasNavSubMenu = $offcanvasNav.find('.dropdown-menu');

      $offcanvasNavSubMenu.parent().prepend('<span class="menu-expand"><i class="ri-arrow-down-s-line"></i></span>');
      $offcanvasNavSubMenu.slideUp();

      $(document).on('click', '.navbar-nav li a, .navbar-nav li .menu-expand', function (e) {
        var $this = $(this);
        if (($this.attr('href') === '#' || $this.hasClass('menu-expand'))) {
          e.preventDefault();
          if ($this.siblings('ul:visible').length) {
            $this.siblings('ul').slideUp('slow');
          } else {
            $this.closest('li').siblings('li').find('ul:visible').slideUp('slow');
            $this.siblings('ul').slideDown('slow');
          }
        }
        if ($this.is('a') || $this.is('span') || $this.hasClass('menu-expand')) {
          $this.parent().toggleClass('menu-open');
        } else if ($this.is('li') && $this.hasClass('dropdown-menu')) {
          $this.toggleClass('menu-open');
        }
      });
    });

  </script>
